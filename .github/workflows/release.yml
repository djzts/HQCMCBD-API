name: Release

# Publishes a GitHub release for a version tag (v*), using the annotated tag
# message as the release notes. Run it by hand to publish an older tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v202606
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch --force --tags origin
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          git for-each-ref "refs/tags/$TAG" --format='%(contents:body)' > notes.md
          # Only the highest version is marked as the latest release.
          newest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ "$TAG" = "$newest" ]; then latest=true; else latest=false; fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag --latest="$latest"
